# TO-DO-07 : Configure JPA. Define properties to ////make Spring Boot to run SQL scripts (test-schema.sql and test-data.sql) located under 'rewards.testdb' directory. Define Spring Boot properties to make JPA show the SQL nicely formatted. Define a Spring Boot property to prevent hibernate from auto-creating and auto-populating database tables; our scripts did it already. Run RewardNetworkTests. Verify it succeeds.

# Configure Spring Boot to run SQL initialization scripts
spring.sql.init.data-locations=classpath:rewards/testdb/test-data.sql
spring.sql.init.schema-locations=classpath:rewards/testdb/test-schema.sql

# Format SQL output for 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Prevent Hibernate from auto-creating and auto-populating database tables
spring.jpa.hibernate.ddl-auto=none